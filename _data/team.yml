postdocs:
- name: Dr. Dawit Mekonen
  role: Postdoctoral Researcher
  photo: /assets/images/team/placeholder.svg
  supervisor: Christo Elmore
  bio: |-
    Dawit Mekonen (PhD) is a health researcher and postdoctoral fellow at York University. His research interests centre on disability-inclusive perinatal care, maternal and reproductive health, health equity, and the use of digital health and artificial intelligence to improve access to care for people with disabilities. He holds a PhD in Rehabilitation Science from Queen’s University, where his doctoral research examined access to perinatal care among women with physical disabilities in rural Ethiopia. His current postdoctoral research focuses on the development of PeriCare, an AI-powered mobile health application designed to support perinatal care for women with disabilities, in partnership with Independent Living Canada. His broader research interests include disability inclusion in health systems, equitable access to maternal healthcare, patient-centred care, and the development of inclusive digital health interventions.
- name: Dr. Debanjan Borthakur
  role: Postdoctoral Researcher
  photo: /assets/images/team/debanjan-borthakur.png
  supervisor: Vijay Mago
  bio: |-
    Dr. Debanjan Borthakur is a behavioural scientist and Connected Minds postdoctoral researcher at York University, Canada. He received his PhD in Psychology from the University of Toronto, where his research examined how fairness, trust, and moral judgments change when people interact with artificial intelligence rather than humans. His broader research interests include the psychology of human–AI interaction, moral psychology, digital health, AI in healthcare, psychophysiology, and responsible AI. He has also taught courses in social psychology, intergroup relations, and the psychology and physiology of emotion at the University of Toronto.
- name: Dr. Frederic Fu
  role: Postdoctoral Researcher, Course Director, SHPM
  photo: /assets/images/team/frederic-fu.png
  supervisor: Vijay Mago
  bio: |-
    Dr. Frederic Pengfei Fu is a Postdoctoral Researcher and Course Director in the School of Health Policy and Management at York University. His research focuses on mental health, health equity, and the use of artificial intelligence and health data analytics to understand health risks among underserved and underrepresented populations. A major area of his work examines mental health, disability, substance use, and access to health and social services among people experiencing homelessness, using population-based and administrative data such as Point-in-Time Counts and the Homeless Individuals and Families Information System. His broader research also explores the responsible and equitable use of artificial intelligence in healthcare, including public attitudes toward AI, algorithmic equity, and the social factors that shape people’s ability to benefit from emerging technologies. His work combines epidemiological and statistical methods, machine learning, evidence synthesis, and community-engaged research, with an emphasis on translating research findings into health policy and practice.
phd_students:
- name: Arunim Garg
  role: PhD student
  photo: /assets/images/team/arunim-garg.jpg
  affiliation: Lecturer
  supervisor: Vijay Mago
  bio: |-
    Arunim Garg is a PhD student in Health Systems Management and Health Data Analytics at York University and an EPIC-AT Fellow (AGE-WELL). His research builds and evaluates multilingual conversational health AI to help older adults navigate care in their own languages, with an emphasis on low-resource languages that mainstream tools overlook. He is also a lecturer and curriculum designer at Acsenda School of Management, where he led the design of its AI & Business Analytics concentration, and holds a master's in Artificial Intelligence from Lakehead University.
- name: John Muteba
  role: PhD student
  photo: /assets/images/team/john-muteba.png
  supervisor: Vijay Mago
  bio: |-
    John investigates algorithmic fairness, bias, and equity in clinical Large Language Models and AI-enabled decision-support systems. His research integrates advanced statistical methods, including Bayesian networks and mediation analysis, with intersectional patient data to evaluate demographic disparities in AI-assisted chest pain assessment and diagnosis. His work focuses on identifying, quantifying, and mitigating systematic bias in medical AI, with the broader goal of ensuring that clinical artificial intelligence is statistically rigorous, clinically reliable, and equitable across diverse patient populations.
- name: Mila Kolpashnikova
  role: PhD student
  photo: /assets/images/team/placeholder.svg
  affiliation: Senior AI Developer
  supervisor: Vijay Mago
  bio: |-
    Senior AI Developer at a Toronto-based startup, specializing in the design and evaluation of agentic workflows and Retrieval-Augmented Generation (RAG) systems. Current research explores AI system architectures and platform sovereignty.
- name: Yash Amethiya
  role: PhD student
  photo: /assets/images/team/yash-amethiya.png
  affiliation: Software Developer
  supervisor: Vijay Mago
  bio: |-
    Yash Amethiya is pursuing PhD in Health (specialized in Health System Management and Health Data Analytics) at York University. His research focuses on introducing design disciplines to Electronic Health Records (EHRs) and Healthcare. By moving beyond traditional widget based EHRs, his work aims to reduce clinician burnout, optimize cognitive load, and encourage dynamic learning health systems.Further, his research emphasizes the application of neurosymbolic artificial intelligence in healthcare, combining transparent symbolic logic and human in the loop guardrails rather than relying on standard black box AI models. He is also a Software Developer at Aurora Constellations, where he leads the development of the prototype for the same research.
