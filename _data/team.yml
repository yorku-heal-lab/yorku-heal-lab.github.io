leadership:
- name: Dr. Christo El Morr
  role: Co-Director
  title: Associate Professor and Chair, Professor
  department: School of Health Policy and Management
  faculty: Faculty of Health, York University
  photo: /assets/images/team/christo-el-morr.png
  bio: >-
    Christo El Morr, PhD, is a Professor of Health Informatics and the Director of the Centre for Feminist Research (CFR) at York University. He is also a Research Scientist at North York General Hospital, Toronto. Additionally, he serves as the Health Informatics Certificate Coordinator and is a former Graduate Program Director and Undergraduate Program Director at the School of Health Policy and Management at York University.


    His research aligns with an Equity Informatics perspective, covering areas such as Equity AI (e.g., patient readmission, disability advocacy), Patient-Centered Virtual Care (e.g., chronic disease management, mental health), Global Health Promotion for equity (e.g., equitable health promotion), and Human Rights Monitoring (e.g., disability rights, Gender-Based Violence). Dr. El Morr is founding member of several organizations, and serves as a member of the scientific committee for several health informatics journals and conferences.


    In Arabic, Dr. El Morr is also a novelist, poet, and theologian. He frequently contributes to Lebanese newspapers and has published 10 books on theology, including on Palestine. His intellectual contributions to social justice advocate for the pursuit of freedom from oppression, freedom from exploitation, and the freedom to celebrate life.
  email: elmorr@yorku.ca
  website: https://scholar.google.ca/citations?user=_X58b2IAAAAJ&hl=en
- name: Dr. Vijay Mago
  role: Co-Director
  title: Associate Professor and Chair, SHPM
  department: School of Health Policy and Management
  faculty: Faculty of Health, York University
  photo: /assets/images/team/vijay-mago.jpeg
  bio: >-
    Dr. Vijay Mago is an Associate Professor and Chair of the School of Health Policy and Management at York University. His interdisciplinary research program focuses on artificial intelligence, machine learning, natural language processing, and large language models, with applications in health and healthcare, including public health surveillance, cardiac care, health equity, and clinical and health-system decision support. He has been involved in more than 42 funded research projects totaling over $7.2 million, reflecting sustained success in building collaborative and externally supported research programs.


    Dr. Mago has authored more than 110 peer-reviewed publications, including 60 journal articles, 46 conference papers, and six book chapters, and has co-edited six books. Student mentorship is a major component of his academic work. He has supervised or co-supervised more than 30 master’s and doctoral students and postdoctoral fellows across several institutions, including 23 master’s thesis students, five doctoral students, and six postdoctoral fellows.


    Alongside his research, Dr. Mago has held substantial academic leadership roles. He currently serves as Chair of the School of Health Policy and Management at York University and previously served as Chair of the Department of Computer Science, Graduate Program Coordinator, and Faculty Research Chair at Lakehead University. His career reflects a strong commitment to interdisciplinary research, graduate training, and academic leadership, with a focus on translating advances in AI and data science into meaningful health and societal impact.
  email: vmago@yorku.ca
  website: https://scholar.google.ca/citations?user=lotIW94AAAAJ&hl=en&oi=ao
collaborators:
- name: Andrew Fisher
  role: Collaborator
  photo: /assets/images/team/andrew-fisher.jpeg
  affiliation: Assistant Professor
  bio: |-
    Andrew Fisher obtained an Honours BSc from Brandon University in 2019 and began his MSc with a specialization in artificial intelligence at Lakehead University. His studies were supported by a SSHRC Grant and a Mitacs Globalink Research Award. In January 2021, he began a PhD at Saint Mary’s University, supported by a Mitacs Accelerate award and an industry partner in the construction sector, where he developed machine learning solutions to automate production workflows. His thesis was recognized with the J. Kevin Vessey Award for the Ph.D. in Applied Science. Andrew was then a Postdoctoral Visitor at York University, funded by the Connected Minds CFREF, where he focused on using large language models to improve the accessibility of health information. Currently, he is an Assistant Professor in the Faculty of Computer Science at the University of New Brunswick.
- name: Nikita Neveditsin
  role: Collaborator
  photo: /assets/images/team/placeholder.svg
  affiliation: Assistant Professor
postdocs:
- name: Dr. Dawit Mekonen
  role: Postdoctoral Researcher
  photo: /assets/images/team/placeholder.svg
  supervisor: Christo El Morr
  bio: |-
    Dawit Mekonen (PhD) is a health researcher and postdoctoral fellow at York University. His research interests centre on disability-inclusive perinatal care, maternal and reproductive health, health equity, and the use of digital health and artificial intelligence to improve access to care for people with disabilities. He holds a PhD in Rehabilitation Science from Queen’s University, where his doctoral research examined access to perinatal care among women with physical disabilities in rural Ethiopia. His current postdoctoral research focuses on the development of PeriCare, an AI-powered mobile health application designed to support perinatal care for women with disabilities, in partnership with Independent Living Canada. His broader research interests include disability inclusion in health systems, equitable access to maternal healthcare, patient-centred care, and the development of inclusive digital health interventions.
- name: Dr. Debanjan Borthakur
  role: Postdoctoral Researcher
  photo: /assets/images/team/debanjan-borthakur.png
  supervisor: Vijay Mago
  bio: |-
    Dr. Debanjan Borthakur is a behavioural scientist and Connected Minds postdoctoral researcher at York University, Canada. He received his PhD in Psychology from the University of Toronto, where his research examined how fairness, trust, and moral judgments change when people interact with artificial intelligence rather than humans. His broader research interests include the psychology of human–AI interaction, moral psychology, digital health, AI in healthcare, psychophysiology, and responsible AI. He has also taught courses in social psychology, intergroup relations, and the psychology and physiology of emotion at the University of Toronto.
- name: Dr. Frederic Fu
  role: Postdoctoral Researcher, Course Director, SHPM
  photo: /assets/images/team/frederic-fu.png
  supervisor: Vijay Mago
  bio: |-
    Dr. Frederic Pengfei Fu is a Postdoctoral Researcher and Course Director in the School of Health Policy and Management at York University. His research focuses on mental health, health equity, and the use of artificial intelligence and health data analytics to understand health risks among underserved and underrepresented populations. A major area of his work examines mental health, disability, substance use, and access to health and social services among people experiencing homelessness, using population-based and administrative data such as Point-in-Time Counts and the Homeless Individuals and Families Information System. His broader research also explores the responsible and equitable use of artificial intelligence in healthcare, including public attitudes toward AI, algorithmic equity, and the social factors that shape people’s ability to benefit from emerging technologies. His work combines epidemiological and statistical methods, machine learning, evidence synthesis, and community-engaged research, with an emphasis on translating research findings into health policy and practice.
phd_students:
- name: Arunim Garg
  role: PhD student
  photo: /assets/images/team/arunim-garg.jpeg
  supervisor: Vijay Mago
  bio: |-
    Arunim Garg is a PhD student in Health Systems Management and Health Data Analytics at York University and an EPIC-AT Fellow (AGE-WELL). His research builds and evaluates multilingual conversational health AI to help older adults navigate care in their own languages, with an emphasis on low-resource languages that mainstream tools overlook. He is also a lecturer and curriculum designer at Acsenda School of Management, where he led the design of its AI & Business Analytics concentration, and holds a master's in Artificial Intelligence from Lakehead University.
- name: John Muteba
  role: PhD student
  photo: /assets/images/team/john-muteba.png
  supervisor: Vijay Mago
  bio: |-
    John investigates algorithmic fairness, bias, and equity in clinical Large Language Models and AI-enabled decision-support systems. His research integrates advanced statistical methods, including Bayesian networks and mediation analysis, with intersectional patient data to evaluate demographic disparities in AI-assisted chest pain assessment and diagnosis. His work focuses on identifying, quantifying, and mitigating systematic bias in medical AI, with the broader goal of ensuring that clinical artificial intelligence is statistically rigorous, clinically reliable, and equitable across diverse patient populations.
- name: Mila Kolpashnikova
  role: PhD student
  photo: /assets/images/team/placeholder.svg
  supervisor: Vijay Mago
  bio: |-
    Senior AI Developer at a Toronto-based startup, specializing in the design and evaluation of agentic workflows and Retrieval-Augmented Generation (RAG) systems. Current research explores AI system architectures and platform sovereignty.
- name: Siyuan (Sabrina) Gao
  role: PhD student
  photo: /assets/images/team/siyuan-sabrina-gao.jpg
  supervisor: Christo El Morr
  bio: "Siyuan (Sabrina) Gao is a PhD student in Global Health at York University. She is also a member of Connected Minds. \nHer research focuses on digital mental health and algorithmic platforms, with attention to how algorithmically recommended mental-health content shapes psychosocial distress, stigma, family communication, cultural belonging, and help-seeking among second-generation Chinese Canadian youth. Her current research combines mixed methods and longitudinal qualitative research to examine how youth interpret, adopt, negotiate, or resist online narratives of distress and how platform algorithms may shape norms and relationships within diasporic communities."
- name: Vaibhav Sawhney
  role: PhD Student
  photo: /assets/images/team/vaibhav-sawhney.jpg
  supervisor: Christo El Morr
  bio: >-
    Vaibhav Sawhney is a PhD researcher in Health Systems Management and Health Data Analytics at York University. He previously completed a Master’s in Health Systems Management and Health Data Analytics, with a research focus on the ethical use of generative AI in addressing disability-related challenges. He also holds a BA (Honours) in Health Studies, graduating summa cum laude.


    His research interests lie at the intersection of artificial intelligence, health data analytics, public health, and health equity, with a particular focus on the use of AI for public health surveillance and decision-making. Alongside his academic work, Vaibhav works in health data and quality management and community-based health promotion, bringing an applied health systems perspective to his research.
- name: Yash Amethiya
  role: PhD student
  photo: /assets/images/team/yash-amethiya.png
  supervisor: Vijay Mago
  bio: |-
    Yash Amethiya is pursuing PhD in Health (specialized in Health System Management and Health Data Analytics) at York University. His research, funded by Connected Minds CFREF, focuses on introducing design disciplines to Electronic Health Records (EHRs) and Healthcare. By moving beyond traditional widget based EHRs, his work aims to reduce clinician burnout, optimize cognitive load, and encourage dynamic learning health systems.Further, his research emphasizes the application of neurosymbolic artificial intelligence in healthcare, combining transparent symbolic logic and human in the loop guardrails rather than relying on standard black box AI models. He is also a Software Developer at Aurora Constellations, where he leads the development of the prototype for the same research.
masters_students:
- name: Rawan Dabboussi
  role: MA Student
  photo: /assets/images/team/rawan-dabboussi.jpg
  supervisor: Christo El Morr
  bio: >-
    Rawan Dabboussi is an MA student in Critical Disability Studies at York University. She holds a BSc in Biochemistry and a Master's degree in Applied Biotechnology, with a research background in molecular science.


    Her emerging research interests explore the intersection of artificial intelligence, disability, and health and social care, particularly how AI-enabled technologies may shape accessibility, autonomy, equity, and the experiences of people with disabilities.
visiting_scholars:
- name: Marco A. Serrano
  role: Visiting Scholar
  photo: /assets/images/team/marco-a-serrano.png
  supervisor: Vijay Mago
  bio: |-
    Marco Antonio Serrano Saavedra is a PhD candidate in Advanced Information Technologies at the University of Castilla-La Mancha (UCLM), with over 15 years of professional experience in data, analytics, cloud technologies, and artificial intelligence. His current research focuses on clinical AI and the development of multimodal predictive models for clinically significant prostate cancer, integrating structured clinical data, natural language processing, and medical imaging. His research interests include clinical machine learning, multimodal learning, quantitative imaging biomarkers, model validation and calibration, and translational AI for clinical decision support. He is also CTO at Medithink, where he leads the development of AI solutions for healthcare.
