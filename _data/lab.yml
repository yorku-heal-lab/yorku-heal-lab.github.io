bio:
- >
  The Health, Evidence, Analytics & Learning (HEAL) Lab at York University brings together researchers working at the intersection of health informatics, artificial intelligence, and data science. Our work spans natural language processing, health data analytics, complex systems modelling, and the responsible use of AI in healthcare and policy.
- >
  HEAL Lab co-directors lead interdisciplinary projects with clinical, community, and industry partners, with an emphasis on health equity, evidence synthesis, and translating research into practice.
